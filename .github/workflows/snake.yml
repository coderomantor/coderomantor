name: Generate contribution snake

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

# GitHub Actions must be enabled for this repository. Run this workflow
# manually once after merging so the output branch and SVG files are created.
permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  generate:
    name: Build and publish snake SVGs
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate light and dark contribution snakes
        uses: Platane/snk/svg-only@v3.5.0
        with:
          github_user_name: coderomantor
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=%2322d3ee
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23a78bfa

      - name: Publish SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
