<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Roman Ullah — coderomantor</title>
  <desc id="desc">Animated midnight-blue developer banner for an aspiring AI and machine learning engineer, with a neural network and circuit-inspired design.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.52" stop-color="#08152d"/>
      <stop offset="1" stop-color="#101036"/>
    </linearGradient>
    <radialGradient id="blueAura" cx="0.76" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#2563eb" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#050816" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetAura" cx="0.26" cy="0.2" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#050816" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="lineFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.08"/>
      <stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0.2"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#38bdf8" stroke-width="0.7" opacity="0.11"/>
      <circle cx="0" cy="0" r="1.2" fill="#7dd3fc" opacity="0.22"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="frame">
      <rect x="2" y="2" width="1196" height="416" rx="24"/>
    </clipPath>
    <style>
      .float { animation: float 6s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
      .dash { animation: dash 8s linear infinite; }
      .pulse { animation: pulse 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .delay-one { animation-delay: -1s; }
      .delay-two { animation-delay: -2s; }
      @keyframes float { to { transform: translateY(-10px); } }
      @keyframes dash { to { stroke-dashoffset: -120; } }
      @keyframes pulse { 0%, 100% { opacity: .55; transform: scale(.92); } 50% { opacity: 1; transform: scale(1.08); } }
      @media (prefers-reduced-motion: reduce) {
        .float, .dash, .pulse { animation: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="420" fill="url(#background)"/>
    <rect width="1200" height="420" fill="url(#grid)"/>
    <rect width="1200" height="420" fill="url(#blueAura)"/>
    <rect width="1200" height="420" fill="url(#violetAura)"/>

    <circle class="float" cx="1110" cy="55" r="160" fill="none" stroke="#8b5cf6" stroke-width="1" opacity="0.12"/>
    <circle class="float delay-two" cx="1110" cy="55" r="125" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.12"/>
    <path d="M0 360C225 305 385 418 612 352S990 288 1200 345V420H0Z" fill="#0ea5e9" opacity="0.035"/>

    <g opacity="0.8">
      <path d="M40 60H145M40 60V111M1160 355H1055M1160 355V304" fill="none" stroke="url(#accent)" stroke-width="2"/>
      <circle cx="145" cy="60" r="3" fill="#22d3ee" filter="url(#glow)"/>
      <circle cx="1055" cy="355" r="3" fill="#a78bfa" filter="url(#glow)"/>
    </g>

    <g font-family="'Segoe UI', Inter, Arial, sans-serif">
      <rect x="70" y="69" width="6" height="223" rx="3" fill="url(#accent)"/>
      <text x="102" y="143" fill="#f8fafc" font-size="66" font-weight="750" letter-spacing="-2">Roman Ullah</text>
      <text x="106" y="184" fill="#7dd3fc" font-size="24" font-weight="600" letter-spacing="4">@coderomantor</text>
      <text x="103" y="242" fill="#e2e8f0" font-size="27" font-weight="650" letter-spacing="1.4">ASPIRING AI/ML ENGINEER</text>
      <text x="104" y="283" fill="#94a3b8" font-size="18" letter-spacing="0.8">Learning in public  •  Building practical systems</text>

      <g transform="translate(102 317)">
        <rect width="154" height="36" rx="18" fill="#0c2a43" stroke="#0ea5e9" stroke-opacity="0.65"/>
        <circle cx="20" cy="18" r="5" fill="#22d3ee" filter="url(#glow)"/>
        <text x="35" y="24" fill="#bae6fd" font-size="14" font-weight="650" letter-spacing="1.2">LEARN</text>
        <rect x="167" width="154" height="36" rx="18" fill="#171c44" stroke="#8b5cf6" stroke-opacity="0.65"/>
        <circle cx="187" cy="18" r="5" fill="#a78bfa" filter="url(#glow)"/>
        <text x="202" y="24" fill="#ddd6fe" font-size="14" font-weight="650" letter-spacing="1.2">BUILD</text>
        <rect x="334" width="154" height="36" rx="18" fill="#082b37" stroke="#22d3ee" stroke-opacity="0.65"/>
        <circle cx="354" cy="18" r="5" fill="#38bdf8" filter="url(#glow)"/>
        <text x="369" y="24" fill="#cffafe" font-size="14" font-weight="650" letter-spacing="1.2">IMPROVE</text>
      </g>
    </g>

    <g transform="translate(730 51)">
      <rect x="25" y="21" width="381" height="291" rx="24" fill="#071226" stroke="#1e3a5f" stroke-width="1.5" opacity="0.9"/>
      <rect x="45" y="43" width="341" height="32" rx="9" fill="#0c1e38"/>
      <circle cx="65" cy="59" r="4" fill="#a78bfa"/>
      <circle cx="81" cy="59" r="4" fill="#38bdf8"/>
      <circle cx="97" cy="59" r="4" fill="#22d3ee"/>
      <text x="116" y="64" fill="#64748b" font-size="12" font-family="'Segoe UI', Inter, Arial, sans-serif" letter-spacing="1">NEURAL_WORKSPACE</text>

      <g fill="none" stroke="url(#lineFade)" stroke-width="2">
        <path class="dash" d="M84 130L171 102L254 144L344 104" stroke-dasharray="8 8"/>
        <path class="dash" d="M84 130L171 190L254 144L344 210" stroke-dasharray="8 8"/>
        <path class="dash" d="M84 248L171 190L254 244L344 210" stroke-dasharray="8 8"/>
        <path class="dash" d="M84 248L171 272L254 244L344 270" stroke-dasharray="8 8"/>
        <path d="M171 102V190M171 190V272M254 144V244" opacity="0.42"/>
      </g>

      <g filter="url(#glow)">
        <circle class="pulse" cx="84" cy="130" r="8" fill="#22d3ee"/>
        <circle class="pulse delay-two" cx="84" cy="248" r="8" fill="#38bdf8"/>
        <circle class="pulse delay-one" cx="171" cy="102" r="9" fill="#38bdf8"/>
        <circle class="pulse delay-two" cx="171" cy="190" r="9" fill="#8b5cf6"/>
        <circle class="pulse" cx="171" cy="272" r="9" fill="#22d3ee"/>
        <circle class="pulse delay-two" cx="254" cy="144" r="10" fill="#a78bfa"/>
        <circle class="pulse delay-one" cx="254" cy="244" r="10" fill="#38bdf8"/>
        <circle class="pulse" cx="344" cy="104" r="8" fill="#22d3ee"/>
        <circle class="pulse delay-one" cx="344" cy="210" r="11" fill="#a78bfa"/>
        <circle class="pulse delay-two" cx="344" cy="270" r="8" fill="#38bdf8"/>
      </g>

      <g fill="#cbd5e1" font-size="10" font-family="'Segoe UI', Inter, Arial, sans-serif" letter-spacing="1">
        <text x="67" y="112">DATA</text>
        <text x="147" y="295">FEATURES</text>
        <text x="233" y="126">MODEL</text>
        <text x="325" y="296">OUTPUT</text>
      </g>
    </g>

    <path d="M622 72H695V122H730M612 335H690V288H755" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.28"/>
    <circle cx="622" cy="72" r="3" fill="#22d3ee"/>
    <circle cx="612" cy="335" r="3" fill="#a78bfa"/>
  </g>

  <rect x="2" y="2" width="1196" height="416" rx="24" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.7"/>
</svg>
